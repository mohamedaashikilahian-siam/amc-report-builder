<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC Report Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6E6A'/%3E%3Cpath d='M9 8h10l4 4v12H9z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 17h8M12 21h8' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="login" class="login" hidden>
  <div class="panel">
    <h1>AMC Report Builder</h1>
    <p class="sub">Sign in with your Google account to open your clients and reports.</p>
    <div class="row" style="margin-top:14px"><button type="button" class="btn primary" data-act="signin">Sign in with Google</button></div>
    <p class="msg bad" id="loginmsg"></p>
  </div>
</section>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div><h1>AMC Report Builder</h1><p class="sub">Fill in the month, check the preview, download Word or PDF.</p></div>
    <div class="row">
      <span id="dbstate" class="pill warn">Loading</span>
      <button type="button" class="btn small" data-act="backup">Back up</button>
      <label class="btn small" for="restorefile" style="cursor:pointer">Restore</label>
      <input type="file" id="restorefile" accept="application/json,.json" hidden>
      <button type="button" class="btn small" id="signout" data-act="signout" hidden>Sign out</button>
    </div>
  </header>
  <p class="msg" id="topmsg" style="margin:-8px 0 10px"></p>
  <div class="layout">
    <div class="col" id="controls">
      <section class="panel"><h2>Client</h2><div id="clients" class="clients"></div><div id="editor"></div></section>
      <div id="form"></div>
    </div>
    <div class="col sticky">
      <section class="panel">
        <div class="preview-head"><h2 style="margin:0">Preview</h2>
          <label class="switch"><input type="checkbox" id="prev"> Include earlier months</label></div>
        <div id="sheets" class="sheets"></div>
      </section>
    </div>
  </div>
</div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
